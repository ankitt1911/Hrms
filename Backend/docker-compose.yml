services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/smart_hrms
    ports: ["5000:5000"]
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
